# ai-leverage/apps/claude-code/app.conf
# How manage.sh installs and updates Claude Code: from Anthropic's apt
# repository, on its stable channel, set up the way Anthropic's setup guide
# does it. apps/README.md explains each line.
NAME="Claude Code"
ABOUT="Anthropic's coding agent for the terminal (works online)"

METHOD=apt
APT_PACKAGE=claude-code
# The stable channel is about a week behind the newest release and skips
# releases with major problems. For every release at once, use
# https://downloads.claude.ai/claude-code/apt/latest with APT_SUITE=latest.
APT_URI=https://downloads.claude.ai/claude-code/apt/stable
APT_SUITE=stable
APT_COMPONENTS=main
APT_SOURCE_FILE=/etc/apt/sources.list.d/claude-code.list
APT_KEY_URL=https://downloads.claude.ai/keys/claude-code.asc
APT_KEY_FILE=/etc/apt/keyrings/claude-code.asc
APT_KEY_FINGERPRINT=31DDDE24DDFAB679F42D7BD2BAA929FF1A7ECACE

COMMAND=claude
# Where Claude Code's own installer (claude.ai/install.sh) puts it. Installing
# from apt removes this copy, so only one Claude Code is on PATH.
REPLACES=("$HOME/.local/bin/claude" "$HOME/.local/share/claude")
KEEPS="Your settings, sign-in and history in ~/.claude and ~/.claude.json stay."
