# ai-leverage/apps/claude-desktop/app.conf
# How manage.sh installs and updates Claude Desktop: from Anthropic's apt
# repository, set up the way Anthropic's Linux guide does it. apps/README.md
# explains each line.
NAME="Claude Desktop"
ABOUT="Anthropic's desktop app: chat, Cowork and Claude Code (works online)"

METHOD=apt
APT_PACKAGE=claude-desktop
APT_URI=https://downloads.claude.ai/claude-desktop/apt/stable
APT_SUITE=stable
APT_COMPONENTS=main
APT_ARCHS=amd64,arm64
APT_SOURCE_FILE=/etc/apt/sources.list.d/claude-desktop.list
APT_KEY_URL=https://downloads.claude.ai/claude-desktop/key.asc
APT_KEY_FILE=/usr/share/keyrings/claude-desktop-archive-keyring.asc
APT_KEY_FINGERPRINT=31DDDE24DDFAB679F42D7BD2BAA929FF1A7ECACE

COMMAND=claude-desktop
KEEPS="Your sign-in and settings stay."
