# ai-leverage/apps/obsidian/app.conf
# How manage.sh installs and updates Obsidian. apps/README.md explains each line.
NAME="Obsidian"
ABOUT="notes app; Hermes can work in one of its vaults"

METHOD=flatpak
FLATPAK_ID=md.obsidian.Obsidian

# Obsidian's .deb and AppImage put this on PATH
COMMAND=obsidian
KEEPS="Your vaults stay where they are, and Obsidian's settings stay in ~/.var/app/md.obsidian.Obsidian."
