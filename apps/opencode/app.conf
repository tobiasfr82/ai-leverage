# ai-leverage/apps/opencode/app.conf
# How manage.sh installs and updates OpenCode: with its own installer, since it
# has no Flatpak or apt repository. apps/README.md explains each line.
NAME="OpenCode"
ABOUT="coding agent for the terminal"

METHOD=script
SCRIPT_INSTALLER_URL=https://opencode.ai/install
SCRIPT_VERSION_ARG=--version
SCRIPT_BIN="$HOME/.opencode/bin/opencode"
SCRIPT_UNINSTALL="uninstall --keep-config --keep-data --force"
GITHUB_REPO=anomalyco/opencode

COMMAND=opencode
KEEPS="Your settings and sessions stay."
