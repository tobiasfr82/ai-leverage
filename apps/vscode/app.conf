# ai-leverage/apps/vscode/app.conf
# How manage.sh installs and updates VS Code: from Microsoft's apt repository,
# set up the way Microsoft's Linux setup guide does it. apps/README.md explains
# each line.
NAME="VS Code"
ABOUT="code editor"

METHOD=apt
APT_PACKAGE=code
APT_URI=https://packages.microsoft.com/repos/code
APT_SUITE=stable
APT_COMPONENTS=main
APT_ARCHS=amd64,arm64,armhf
APT_SOURCE_FILE=/etc/apt/sources.list.d/vscode.sources
APT_KEY_URL=https://packages.microsoft.com/keys/microsoft.asc
APT_KEY_FILE=/usr/share/keyrings/microsoft.gpg
APT_KEY_FINGERPRINT=BC528686B50D79E339D3721CEB3E94ADBE1229CF

COMMAND=code
KEEPS="Your settings (~/.config/Code) and extensions (~/.vscode) stay."
