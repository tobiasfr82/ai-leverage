services:
  docling:
    image: quay.io/docling-project/docling-serve-cu128:latest
    container_name: docling
    restart: unless-stopped
    ports:
      # This PC only (web UI at http://localhost:5001/ui). Other containers
      # use http://docling:5001 over the shared network.
      - "127.0.0.1:5001:5001"
    environment:
      - DOCLING_SERVE_ENABLE_UI=1
      - DOCLING_DEVICE=cuda
      - DOCLING_SERVE_OCR_ENGINE=easyocr
      - DOCLING_SERVE_MAX_SYNC_WAIT=60
      # Use the direct cache path
      - /models/huggingface
      - DOCLING_ARTIFACTS_PATH=/models/hub
      - DOCLING_MODELS_CACHE=/models/hub
    volumes:
      - ./data:/opt/app-root/src/data
      - ../../models/hf_hub:/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

# Shared "ai-leverage" network: other containers reach this service as
# http://docling:5001. Created by src/bash/docker-create-network.sh.
networks:
  default:
    name: ai-leverage
    external: true