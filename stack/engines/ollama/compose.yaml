services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    ports:
      # This PC only. Other containers use http://ollama:11434 over the shared
      # network. OLLAMA_PORT in .env changes the port on this PC.
      - "127.0.0.1:${OLLAMA_PORT:-11434}:11434"
    labels:
      # What manage.sh shows while it runs: the address apps use, not a web page
      ai-leverage.url: "http://localhost:${OLLAMA_PORT:-11434} (API)"
      # ...and the address other containers use, such as Open WebUI: the
      # container's name and its own port, the same whatever .env says
      ai-leverage.connect: "http://ollama:11434 (in Open WebUI: Connections → Ollama API)"
      # Where the update check finds the version: the image's own label names
      # the Ubuntu it's built on, so ask Ollama, and its GitHub releases
      ai-leverage.version-command: "ollama --version"
      ai-leverage.releases: "ollama/ollama"
      # Its data/ holds only its key: nothing for Update to back up first
      ai-leverage.data: "none"
    volumes:
      # Keys and settings stay with the service; the models themselves go to
      # the shared models/ folder at the top of the repo.
      - ./data:/root/.ollama
      - ../../../models/ollama:/root/.ollama/models
    environment:
      # Ollama's cloud features off: models that run on ollama.com and its web
      # search. Without this, Ollama also contacts ollama.com at every start and
      # every 4 hours after, signed with this install's key, for its cloud model
      # list and model tips. Downloading models still works.
      # OLLAMA_NO_CLOUD=0 in .env turns the cloud back on.
      - OLLAMA_NO_CLOUD=${OLLAMA_NO_CLOUD:-1}
    # Optional settings for this machine, such as context size. Without them
    # Ollama picks values that suit your GPU. See .env.template.
    env_file:
      - path: .env
        required: false
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

# Shared "ai-leverage" network: other containers reach this service as
# http://ollama:11434. Created by src/bash/docker-create-network.sh.
networks:
  default:
    name: ai-leverage
    external: true
