services:
  vllm:
    # Stable release by default. VLLM_IMAGE_TAG in .env picks another build,
    # e.g. "nightly" for the newest model support.
    image: vllm/vllm-openai:${VLLM_IMAGE_TAG:-latest}
    container_name: vllm
    restart: unless-stopped
    ports:
      # This PC only. Other containers use http://vllm:8000/v1 over the shared
      # network. VLLM_PORT in .env changes the port on this PC.
      - "127.0.0.1:${VLLM_PORT:-8000}:8000"
    labels:
      # What manage.sh shows while it runs: the address apps use, not a web page
      ai-leverage.url: "http://localhost:${VLLM_PORT:-8000}/v1 (API)"
      # ...and the address other containers use, such as Open WebUI: the
      # container's name and its own port, the same whatever .env says
      ai-leverage.connect: "http://vllm:8000/v1 (in Open WebUI: Connections → OpenAI API, no key)"
      # ...and under it, the model this container was started with
      ai-leverage.info: "model: ${HUGGINGFACE_MODEL}"
    volumes:
      # Models downloaded by stack/downloaders/huggingface, read-only: vLLM can
      # load them, but never change, delete or add anything there. So the files
      # stay yours, not root's, and cleaning up never needs sudo.
      - ../../../models/huggingface/hub:/models/huggingface/hub:ro
    environment:
      - HF_HUB_CACHE=/models/huggingface/hub
      # Never go online for a model: run only what the downloader fetched.
      # set_model.sh shows what a download is missing.
      - HF_HUB_OFFLINE=1
      # vLLM reports your hardware, the model type and its settings to
      # stats.vllm.ai at every start and every 10 minutes after, unless told
      # not to. Either name turns that off; vLLM reads both.
      - VLLM_NO_USAGE_STATS=1
      - DO_NOT_TRACK=1
    # vLLM's worker processes pass data through shared memory, and Docker's
    # default allowance for that (64 MB) is too small. An allowance of its own
    # keeps it apart from the rest of the PC. It's a ceiling: it only takes RAM
    # as it fills, and one GPU fills little of it. SHM_SIZE in .env changes it.
    shm_size: ${SHM_SIZE:-16gb}
    # Pick the model with ./set_model.sh. The rest is optional; by default vLLM
    # takes 85% of the GPU's memory and fits the longest context it can.
    # VLLM_EXTRA_ARGS in .env adds any other vLLM option, e.g. ones a model needs.
    command: >
      --model ${HUGGINGFACE_MODEL:?no model chosen yet - run set_model.sh in stack/engines/vllm}
      --max-model-len ${CONTEXT_SIZE:-auto}
      --gpu-memory-utilization ${VRAM_LIMIT:-0.85}
      ${VLLM_EXTRA_ARGS:-}
    # Optional settings for this machine. See .env.template.
    env_file:
      - path: .env
        required: false
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

# Shared "ai-leverage" network: other containers reach this service as
# http://vllm:8000/v1. Created by src/bash/docker-create-network.sh.
networks:
  default:
    name: ai-leverage
    external: true
