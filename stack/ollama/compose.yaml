services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    ports:
      # This PC only. Other containers use http://ollama:11434 over the shared
      # network. OLLAMA_PORT in .env changes the port on this PC.
      - "127.0.0.1:${OLLAMA_PORT:-11434}:11434"
    volumes:
      # Keys and settings stay with the service; the models themselves go to
      # the shared models/ folder at the top of the repo.
      - ./data:/root/.ollama
      - ../../models/ollama:/root/.ollama/models
    # Optional settings for this machine, such as context size. Without them
    # Ollama picks values that suit your GPU. See .env.template.
    env_file:
      - path: .env
        required: false
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

# Shared "ai-leverage" network: other containers reach this service as
# http://ollama:11434. Created by src/bash/docker-create-network.sh.
networks:
  default:
    name: ai-leverage
    external: true
