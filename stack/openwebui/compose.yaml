services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:cuda
    container_name: openwebui
    restart: unless-stopped
    ports:
      - "3000:8080"
    volumes:
      - ./data:/app/backend/data
    environment:
      # --- Core API Integrations ---
      - 'OLLAMA_BASE_URL=http://host.docker.internal:11434'
      - 'DOCLING_HTTP_BASE_URL=http://host.docker.internal:5001'
           
    extra_hosts:
      - "host.docker.internal:host-gateway" # Required for Linux to use host.docker.internal
    # GPU Configuration
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    # Logging options
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"