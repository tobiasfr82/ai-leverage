services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:cuda
    container_name: openwebui
    restart: unless-stopped
    ports:
      # This PC only by default. To let other devices on your network in,
      # set OPENWEBUI_BIND_ADDRESS in a local .env file (see .env.template).
      - "${OPENWEBUI_BIND_ADDRESS:-127.0.0.1}:3000:8080"
    volumes:
      - ./data:/app/backend/data
    environment:
      # --- Core API Integrations ---
      # Only used on first start. After that Open WebUI keeps its own copy in
      # its database; change these under Admin Panel > Settings instead.
      - 'OLLAMA_BASE_URL=http://ollama:11434'
      - 'DOCLING_SERVER_URL=http://docling:5001'
           
    extra_hosts:
      - "host.docker.internal:host-gateway" # Required for Linux to use host.docker.internal
    # GPU Configuration
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    # Logging options
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

# Shared "ai-leverage" network: reaches Ollama and Docling by name.
# Created by src/bash/docker-create-network.sh.
networks:
  default:
    name: ai-leverage
    external: true