services:
  docling:
    # A Docling release. The image ships with the models it needs, so there
    # is nothing to download, and with PyTorch for NVIDIA GPUs. (The
    # docling-serve-cu128 image stopped getting updates at 1.12.0, in
    # February 2026; Docling's releases go to this one.) Its "latest" tag also
    # moves with every development build, so Update follows Docling's GitHub
    # releases instead (the labels below) and writes the newest one to
    # DOCLING_IMAGE_TAG in .env.
    image: quay.io/docling-project/docling-serve:${DOCLING_IMAGE_TAG:-v1.37.0}
    container_name: docling
    restart: unless-stopped
    ports:
      # This PC only (web UI at http://localhost:5001/ui). Other containers use
      # http://docling:5001 over the shared network. DOCLING_PORT in .env
      # changes the port on this PC.
      - "127.0.0.1:${DOCLING_PORT:-5001}:5001"
    labels:
      # What manage.sh shows while it runs: the web UI
      ai-leverage.url: "http://localhost:${DOCLING_PORT:-5001}/ui"
      # ...and the address other containers use, such as Open WebUI: the
      # container's name and its own port, the same whatever .env says
      ai-leverage.connect: "http://docling:5001 (in Open WebUI: Documents → Docling)"
      # ...and where the menu asks whether it's ready: Docling says "not yet"
      # there until its models are loaded
      ai-leverage.ready: "http://localhost:${DOCLING_PORT:-5001}/ready"
      # Update follows the newest release of this GitHub project
      ai-leverage.follow: "releases"
      ai-leverage.releases: "docling-project/docling-serve"
    environment:
      - DOCLING_SERVE_ENABLE_UI=1
    # Optional settings for this machine. See .env.template.
    env_file:
      - path: .env
        required: false
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

# Shared "ai-leverage" network: other containers reach this service as
# http://docling:5001. Created by src/bash/docker-create-network.sh.
networks:
  default:
    name: ai-leverage
    external: true
