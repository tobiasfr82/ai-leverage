services:
  open-webui:
    # The standard image, without a GPU: the heavy work (chat, embeddings,
    # reading documents) happens in Ollama, vLLM, SGLang, llama.cpp and Docling.
    # "main" is Open WebUI's release branch, the same image as "latest".
    image: ghcr.io/open-webui/open-webui:main
    container_name: openwebui
    restart: unless-stopped
    ports:
      # This PC only by default. To let other devices on your network in,
      # set OPENWEBUI_BIND_ADDRESS in a local .env file (see .env.template).
      - "${OPENWEBUI_BIND_ADDRESS:-127.0.0.1}:${OPENWEBUI_PORT:-3000}:8080"
    labels:
      # Where the menu asks whether it's ready: Open WebUI takes a while to
      # start, and the menu says LOADING, not UP, until it answers
      ai-leverage.ready: "http://${OPENWEBUI_BIND_ADDRESS:-127.0.0.1}:${OPENWEBUI_PORT:-3000}/health"
      # Where the update check finds the version: the image's own label only
      # says "main", so read it from Open WebUI's package file
      ai-leverage.version-command: "grep -m1 '\"version\"' /app/package.json"
      # What Update offers to back up first (to backups/), since a new version
      # may convert it. Its cache holds models it downloads again by itself
      # (about 1 GB), so backups leave it out.
      ai-leverage.data: "your chats, users and uploads"
      ai-leverage.data-skip: "data/cache"
    volumes:
      - ./data:/app/backend/data
    environment:
      # --- Core API Integrations ---
      # Only used on first start. After that Open WebUI keeps its own copy in
      # its database; change these under Admin Panel > Settings instead.
      # Chat models: Ollama, plus vLLM, SGLang or llama.cpp when they run, plus
      # Hermes once hermes -> connect_openwebui has saved Hermes's key in .env.
      # The keys go in the same order as the addresses; the engines need none.
      - 'OLLAMA_BASE_URL=http://ollama:11434'
      - 'OPENAI_API_BASE_URLS=http://vllm:8000/v1;http://sglang:30000/v1;http://llamacpp:8080/v1${HERMES_API_KEY:+;http://hermes:8642/v1}'
      - 'OPENAI_API_KEYS=;;${HERMES_API_KEY:+;${HERMES_API_KEY:-}}'
      # Reading uploaded documents
      - 'CONTENT_EXTRACTION_ENGINE=docling'
      - 'DOCLING_SERVER_URL=http://docling:5001'
      # Document search (built from stack/downloaders/ollama/specs by
      # downloaders -> ollama -> sync_models)
      - 'RAG_EMBEDDING_ENGINE=ollama'
      - 'RAG_EMBEDDING_MODEL=rag/qwen3-embedding:8b'
      - 'RAG_OLLAMA_BASE_URL=http://ollama:11434'
      # --- Privacy ---
      # Counts on every start. No asking GitHub for the newest version each
      # time someone opens Open WebUI: manage.sh -> Update gets it anyway.
      - 'ENABLE_VERSION_UPDATE_CHECK=${ENABLE_VERSION_UPDATE_CHECK:-false}'
    # Optional settings for this machine. See .env.template.
    env_file:
      - path: .env
        required: false
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

# Shared "ai-leverage" network: reaches the engines and Docling by name, so no
# host.docker.internal is needed.
# Created by src/bash/docker-create-network.sh.
networks:
  default:
    name: ai-leverage
    external: true
